services:
  - type: web
    name: novara-auth
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: JWT_SECRET
        generateValue: true
